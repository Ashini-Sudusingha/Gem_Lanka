<!DOCTYPE html>
<html lang="en">

<head>

<body class=" text-white  font-['Poppins',sans-serif] overflow-x-hidden "

    <div class="sticky w-screen" id="navBar"></div>

                            </div>
                        </div>

                    </div>

                    <!-- claruty-->

                        <label class="block mb-2 text-sm font-medium text-white">Clarity</label>

                    <!-- Shape-->

    <div id="footer" class=""></div>


    <script>
        const weightRange = document.getElementById("weightRange");
        const weightNumber = document.getElementById("weightNumber");
        const priceRange = document.getElementById("priceRange");
        const priceNumber = document.getElementById("priceNumber");


        // Range → Number update
        weightRange.addEventListener("input", function () {
            weightNumber.value = this.value;
        });

        // Number → Range update
        weightNumber.addEventListener("input", function () {
            // Value limit check
            if (this.value < 1) this.value = 1;
            if (this.value > 500) this.value = 90;
            weightRange.value = this.value;
        });

        // Range → Number update
        priceRange.addEventListener("input", function () {
            priceNumber.value = this.value;
        });

        // Number → Range update
        priceNumber.addEventListener("input", function () {
            // Value limit check
            if (this.value < 1) this.value = 1;
            if (this.value > 10000) this.value = 90;
            priceRange.value = this.value;
        });
    </script>

    <script src="script.js"></script>
