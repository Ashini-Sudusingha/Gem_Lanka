<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Test Frontend</title>
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body onload="loadNavBar();">
    <!-- Initially hidden with 'hidden' class -->
          <div id="orderModal" class="fixed inset-0 z-50 overflow-y-auto">
            <!-- Modal Overlay -->
            <div
                class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center modal-overlay sm:block sm:p-0">

                <!-- Dark background overlay -->
                <div class="fixed inset-0 transition-opacity" aria-hidden="true" onclick="closeModal()">
                    <div class="absolute inset-0 bg-gray-800 opacity-75"></div>
                </div>

                <!-- Centering trick -->
                <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

                <!-- Modal Card -->
                <div
                    class="relative inline-block w-full max-w-md p-6 align-bottom transition-all transform bg-white shadow-xl rounded-2xl sm:my-8 sm:align-middle md:p-8">

                    <!-- Close Button -->
                    <button onclick="closeModal()"
                        class="absolute text-gray-400 transition-colors duration-200 top-4 right-4 hover:text-gray-600">
                        <i class="text-xl fas fa-times">*</i>
                    </button>

                    <!-- Content -->
                    <div class="w-full">
                        <!-- Header -->
                        <h2 class="text-2xl font-bold text-center text-gray-800">Order Details</h2>
                        <p class="mt-1 text-center text-gray-500">Complete your purchase</p>

                        <!-- Product Details -->
                        <div class="flex items-center mt-6 space-x-4" id="productLoad">
                            <img src="https://media.istockphoto.com/id/913851526/photo/white-headphones.webp?a=1&b=1&s=612x612&w=0&k=20&c=1XeKlfmsO28pA3VLjiJFvvyl9AwFYjilm5AOMJGrwqM="
                                alt="Product Image" class="w-20 h-20 rounded-lg shadow">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-800" id="title">Wireless Headphones</h3>
                                <p class="text-sm text-gray-500" id="details">Noise Cancelling, Bluetooth 5.0</p>
                            </div>
                        </div>

                        <!-- Price Breakdown -->
                        <div class="mt-6 space-y-3">
                            <div class="flex justify-between text-gray-600">
                                <span>Subtotal</span>
                                <span id="total">$149.99</span>
                            </div>
                            <div class="flex justify-between text-gray-600">
                                <span>Shipping</span>
                                <span class="text-green-500" id="shipping">Free</span>
                            </div>
                            <div class="flex justify-between font-semibold text-gray-800">
                                <span>Total</span>
                                <span id="Subtotal">$149.99</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
  <script src="script.js"></script>
</body>

</html>
