<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jems Store Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="src/output.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="scrypt.js"></script>
    <script src="../path/to/flowbite/dist/flowbite.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>

<body class="flex  bg-gray-100 font-['Poppins',sans-serif] " onload="loadProductList();">



    <!-- Main Content -->
    <main class="flex-1 p-6">



        <!-- Cards and Graph Section -->
        <div class="flex flex-col gap-6 lg:flex-row">
            <!-- Left side: Stat Cards & Graph -->
            <section class="flex-1">
                <!-- Stat Cards -->
                <h1 class="mb-2 text-4xl font-bold">Dashboard</h1>
                <div class="grid grid-cols-1 gap-6 mb-6 md:grid-cols-3">
                    <!-- Total Sales Card -->

                    <div class="flex items-center justify-between p-6 bg-white shadow-md rounded-xl">
                        <div>
                            <p class="text-sm text-gray-500">Total Order</p>
                            <h2 class="mt-1 text-2xl font-bold text-gray-900" id="orderCount">0</h2>
                        </div>
                        <div class="p-3 text-blue-500 bg-blue-100 rounded-full">
                            <i class="text-xl fas fa-chart-bar"></i>
                        </div>
                    </div>
                    <!-- Card Total Card -->
                    <div class="flex items-center justify-between p-6 bg-white shadow-md rounded-xl">
                        <div>
                            <p class="text-sm text-gray-500">Total Sales</p>
                            <h2 class="mt-1 text-2xl font-bold text-gray-900" id="totalSale">$0</h2>
                        </div>
                        <div class="p-3 text-indigo-500 bg-indigo-100 rounded-full">
                            <i class="text-xl fas fa-credit-card"></i>
                        </div>
                    </div>
                    <!-- Cash Total Card -->
                    <div class="flex items-center justify-between p-6 bg-white shadow-md rounded-xl">
                        <div>
                            <p class="text-sm text-gray-500"> Total profit</p>
                            <h2 class="mt-1 text-2xl font-bold text-gray-900" id="totalProfite">$0</h2>
                        </div>
                        <div class="p-3 text-green-500 bg-green-100 rounded-full">
                            <i class="text-xl fas fa-money-bill-wave"></i>
                        </div>
                    </div>
                </div>

                <!-- Graph View -->
                <div class="p-6 bg-white shadow-md rounded-xl">
                    <h1 class="mb-2 text-2xl font-semibold"> have to shipping</h1>

                    <div id="tab1" class="justify-center p-4 mx-auto tabcontent">
                        <div class="container px-4 py-8 mx-auto sm:px-6 lg:px-8 ">
                            <div class="flex justify-center">
                                <table id="example" class="w-full mx-auto bg-orange-500 table-auto table-style">
                                    <thead>
                                        <tr>
                                            <th class="px-4 py-2">ORDER ID</th>
                                            <th class="px-4 py-2"></th>
                                            <th class="px-4 py-2">TITLE</th>
                                            <th class="px-4 py-2">STATUS</th>
                                            <th class="px-4 py-2">QTY</th>
                                            <th class="px-4 py-2">USER aDDRESS</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200" id="body">
                                        <!--row start-->

                                        <!--row start-->
                                        <!-- More rows... -->

                                    </tbody>
                                </table>
                            </div>
            </section>

        </div>
    </main>
    <script src="js/admin-overview.js"></script>


</body>

</html>
